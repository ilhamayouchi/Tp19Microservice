# Config statique (Étape 5 / 9) - désactivée car le fichier s'appelle app.yml.
# Pour l'activer : renommer en application.yml et mettre spring.cloud.discovery.enabled=false
spring:
  cloud:
    gateway:
      routes:
        - id: r1
          uri: "http://localhost:8088"
          predicates:
            - Path=/clients/**
        - id: r2
          uri: "http://localhost:8088"
          predicates:
            - Path=/client/**
        - id: r3
          uri: "http://localhost:8089"
          predicates:
            - Path=/voitures/**
